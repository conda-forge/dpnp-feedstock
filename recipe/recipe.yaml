schema_version: 1

context:
  version: "0.21.0"
  buildnumber: 0

package:
  name: dpnp
  version: ${{ version }}

source:
  url: https://github.com/IntelPython/dpnp/archive/refs/tags/${{ version }}.tar.gz
  sha256: fae0debe9fad0313121b6b9c9a21842343827f5ca02f3537ebb2d18734479105

build:
  number: ${{ buildnumber }}
  skip: osx or match(python, "<3.10")
  dynamic_linking:
    missing_dso_allowlist:
      - '*DPCTLSyclInterface*'
      - if: win
        then: '*/dpnp_backend_c.dll'

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('dpcpp') }}
    - ninja >=1.11.1
    - cmake >=3.31.6
  host:
    - python
    - pip >=25.0
    - pybind11 >=3.0.2
    - setuptools >=79.0.1
    - wheel >=0.45.1
    - python-build >=1.2.2
    - scikit-build >=0.18.1
    - cython >=3.1.0
    - numpy
    - versioneer ==0.29
    # versioneer dependency
    - if: match(python, "<3.11")
      then: tomli
    - dpctl >=0.23.0
    - mkl-devel-dpcpp
    - onedpl-devel
    - tbb-devel
  run:
    - python
    - ${{ pin_compatible('dpctl', lower_bound='x.x.x', upper_bound=None) }}
    - numpy >=1.26.0
    # the Intel OpenCL runtime intentionally leaves the ICD loader to the consumer
    - if: linux
      then: ocl-icd-system
    - if: win
      then: khronos-opencl-icd-loader
  ignore_run_exports:
    by_name:
      # built with Intel DPC++ (icx), which links the Intel runtime, not the MSVC one
      - if: win
        then: vc14_runtime
      - if: win
        then: ucrt

tests:
  - requirements:
      run:
        - pip
    script:
      - pip check
      - python -c "import dpnp; print(dpnp.__version__)"
      - python -m dpctl -f

about:
  homepage: https://github.com/IntelPython/dpnp
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: 'Data Parallel Extension for NumPy'
  description: |
    Data Parallel Extension for NumPy (dpnp) is a Python library that
    implements a subset of the NumPy API using SYCL, providing array
    computations that can be offloaded to Intel GPUs and other SYCL devices.

extra:
  recipe-maintainers:
    - antonwolfy
    - vlad-perevezentsev
    - ndgrigorian
